<style>
        body {

            overflow-x: hidden;

        }

        .glass-card {
            background: rgba(22, 38, 56, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-gradient {
            background: linear-gradient(135deg, #2563EB 0%, #00C2A8 100%);
        }

        .hero-title-text {
            background: linear-gradient(to right, #ffffff 30%, #b4c5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input:focus {
            border-color: #41ddc2;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(65, 221, 194, 0.1);
            outline: none;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .orb-1 { width: 400px; height: 400px; background: #2563EB; top: -100px; right: -100px; }
        .orb-2 { width: 500px; height: 500px; background: #00C2A8; bottom: -200px; left: -100px; }

        .reveal {
            animation: reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .btn-premium {
            background: linear-gradient(135deg, #2563EB 0%, #00C2A8 100%);
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);

<body class="bg-background min-h-screen flex items-center justify-center p-sm selection:bg-secondary-container selection:text-on-secondary-container" style="background-color: #061423; background-image: none;">
<!-- Atmospheric Elements -->
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[460px] reveal">
<div class="glass-card rounded-3xl p-lg md:p-xl flex flex-col gap-lg">
<!-- Logo Section -->
<header class="flex flex-col items-center gap-sm">
<div class="w-40 h-auto mb-xs transform hover:scale-105 transition-transform duration-500 flex items-center justify-center overflow-hidden invert brightness-200">
                {{DATA:DOCUMENT:DOCUMENT_6}}
            </div>
<div class="text-center">
<h1 class="font-display-lg text-headline-lg hero-title-text tracking-tight">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant/80 mt-base">Log in to manage your automated notifications</p>
</div>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md" id="loginForm" onsubmit="return false">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Work Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors">mail</span>
<input class="form-input w-full pl-12 pr-4 py-3.5 rounded-xl font-body-md text-on-surface placeholder:text-outline/40" id="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors font-semibold" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors">lock</span>
<input class="form-input w-full pl-12 pr-12 py-3.5 rounded-xl font-body-md text-on-surface placeholder:text-outline/40" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center py-xs">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border border-white/10 rounded-lg bg-white/5 checked:bg-secondary checked:border-secondary transition-all" type="checkbox">
<span class="material-symbols-outlined absolute text-[16px] text-on-secondary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: &quot;wght&quot; 700;">check</span>
</div>
<span class="font-body-md text-on-surface-variant/80 group-hover:text-on-surface transition-colors">Keep me signed in</span>
</label>
</div>
<!-- CTA Button -->
<button class="btn-premium w-full py-4 rounded-xl font-bold text-headline-md text-white flex items-center justify-center gap-sm mt-xs" type="submit">
<span class="">Secure Sign In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Login / Alternate -->
<div class="flex flex-col gap-md">
<div class="relative flex items-center py-base">
<div class="flex-grow border-t border-white/5"></div>

<div class="flex-grow border-t border-white/5"></div>
</div>

</div>
<!-- Footer Meta -->

<p class="font-body-md text-on-surface-variant/70">
                Don't have an account? 
                <a class="text-secondary font-bold hover:text-primary transition-colors ml-1" href="#">Get Started</a>
</p>
</footer>
</div>
<!-- Trust Badges -->
</main>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('passToggleIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    // Interactive button scaling
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('mousedown', () => {
            button.style.transform = 'scale(0.97)';
        });
        button.addEventListener('mouseup', () => {
            button.style.transform = '';
        });
        button.addEventListener('mouseleave', () => {
            button.style.transform = '';
        });
    });
</script>
